<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZombieMusic | Historial de Versiones</title>
    <link rel="stylesheet" href="css/Styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        .versions-container {
            padding: 80px 8%;
            max-width: 900px;
            margin: auto;
        }
        .version-card {
            background: var(--bg-card);
            border: 1px solid #1a3a24;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .version-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .version-header h2 {
            color: var(--neon-green);
        }
        .version-header span {
            color: var(--text-gray);
            font-size: 14px;
        }
        .version-changelog ul {
            list-style-type: '✓';
            margin-left: 20px;
            color: var(--text-gray);
        }
        .version-changelog li {
            margin-bottom: 8px;
            padding-left: 10px;
        }
        .download-link {
            display: inline-block;
            margin-top: 20px;
            background: var(--neon-green);
            color: black;
            padding: 10px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <a href="index.html" style="display: flex; align-items: center; text-decoration: none; color: var(--neon-green);">
                <img src="imagenes/logo.png" alt="ZombieMusic Logo">
                <span>ZombieMusic</span>
            </a>
        </div>
        <nav>
            <a href="index.html#features">Funciones</a>
            <a href="index.html#tech">Tecnología</a>
            <a href="index.html#roadmap">Roadmap</a>
            <a href="descargar.html" class="nav-download">Historial de Versiones</a>
        </nav>
    </header>

    <main class="versions-container" id="version-list">
        <h1 style="text-align: center; margin-bottom: 50px; font-family: 'Orbitron', sans-serif;">Historial de Versiones</h1>
        <!-- Las versiones se cargarán aquí dinámicamente -->
    </main>

    <footer>
        <p>&copy; <span id="year">2024</span> ZombieMusic - Desarrollado con enfoque moderno en Android.</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        fetch('versions.json')
            .then(response => response.json())
            .then(versions => {
                const versionListContainer = document.getElementById('version-list');
                if (versions.length > 0) {
                    versions.forEach(version => {
                        const changelogItems = version.changelog.map(item => `<li>${item}</li>`).join('');
                        const versionCard = `
                            <div class="version-card">
                                <div class="version-header">
                                    <h2>Versión ${version.version}</h2>
                                    <span>${version.date}</span>
                                </div>
                                <div class="version-changelog">
                                    <p>Cambios:</p>
                                    <ul>
                                        ${changelogItems}
                                    </ul>
                                </div>
                                <a href="${version.url}" class="download-link" download>Descargar APK</a>
                            </div>
                        `;
                        versionListContainer.innerHTML += versionCard;
                    });
                } else {
                    versionListContainer.innerHTML = '<p style="text-align: center;">No se encontraron versiones.</p>';
                }
            })
            .catch(error => {
                console.error('Error al cargar el historial de versiones:', error);
                document.getElementById('version-list').innerHTML = '<p style="text-align: center;">No se pudo cargar el historial de versiones.</p>';
            });
    </script>

</body>
</html>
