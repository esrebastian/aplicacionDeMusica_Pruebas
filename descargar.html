<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Versiones - ZombieMusic</title>
    <link rel="stylesheet" href="css/Styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #fff;
        }
        .navbar {
            justify-content: space-between;
            padding: 1rem 2rem;
            background-color: #1a1a1a;
        }
        .container {
            padding: 2rem;
            max-width: 800px;
            margin: 2rem auto;
            background-color: #1a1a1a;
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            color: #00ff00;
            margin-bottom: 2rem;
        }
        .version {
            border-bottom: 1px solid #333;
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .version:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .version-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .version-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
        }
        .version-date {
            font-size: 0.9rem;
            color: #aaa;
        }
        .changelog {
            list-style: none;
            padding-left: 0;
        }
        .changelog li {
            margin-bottom: 0.5rem;
            padding-left: 1.5rem;
            position: relative;
        }
        .changelog li::before {
            content: '+';
            position: absolute;
            left: 0;
            color: #00ff00;
        }
        .download-link {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: #00ff00;
            color: #121212;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .download-link:hover {
            background-color: #00cc00;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center;">
                <img src="imagenes/logo.png" alt="ZombieMusic Logo">
                <span>ZombieMusic</span>
            </a>
        </div>
        <nav>
            <a href="index.html#features">Funciones</a>
            <a href="index.html#tech">Tecnología</a>
            <a href="index.html#roadmap">Roadmap</a>
        </nav>
    </header>

    <div class="container">
        <h1>Historial de Versiones</h1>
        <div id="version-history">
            <!-- Las versiones se cargarán aquí dinámicamente -->
        </div>
    </div>

    <script>
        fetch('versions.json')
            .then(response => response.json())
            .then(versions => {
                const historyContainer = document.getElementById('version-history');
                if (versions.length > 0) {
                    versions.forEach(version => {
                        const versionElement = document.createElement('div');
                        versionElement.className = 'version';

                        let changelogItems = '';
                        version.changelog.forEach(item => {
                            changelogItems += `<li>${item}</li>`;
                        });

                        versionElement.innerHTML = `
                            <div class="version-header">
                                <h2 class="version-title">Versión ${version.version}</h2>
                                <span class="version-date">${version.date}</span>
                            </div>
                            <ul class="changelog">
                                ${changelogItems}
                            </ul>
                            <a href="${version.url}" class="download-link" download>Descargar</a>
                        `;
                        historyContainer.appendChild(versionElement);
                    });
                } else {
                    historyContainer.innerHTML = '<p>No hay versiones disponibles.</p>';
                }
            })
            .catch(error => {
                console.error('Error al cargar el historial de versiones:', error);
                document.getElementById('version-history').innerHTML = '<p>Error al cargar el historial de versiones.</p>';
            });
    </script>

</body>
</html>
